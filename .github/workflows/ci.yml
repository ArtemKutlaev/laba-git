name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required file
        run: test -s lab_file.txt

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD